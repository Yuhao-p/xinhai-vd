name: collect-vd
# 每次執行連續收集約5.5小時（每分鐘一筆），每30分鐘存檔一次。
# 每次執行一開始就排好下一次（自我接力），排程每小時觸發只是備援；
# 同時只跑一個，前一個結束後，排隊中的下一個會立刻接手。
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect-vd
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - name: Queue next run
        # GitHub的排程在新repo常常不觸發，所以每次一開始就先排好下一次；
        # 下一次會在本次結束後才開始（同一concurrency group只跑一個）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "${{ github.repository }}" || echo "::warning::queue next run failed"
      - name: Collect for ~5.5 hours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add data
            git diff --cached --quiet && return 0
            git commit -q -m "VD $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && return 0; sleep 5; done
          }
          end=$((SECONDS + 19800))
          last=$SECONDS
          while [ $SECONDS -lt $end ]; do
            python3 collect.py || echo "fetch failed"
            if [ $((SECONDS - last)) -ge 1800 ]; then save; last=$SECONDS; fi
            sleep $((65 - 10#$(date +%S)))
          done
          save
