name: collect-vd
# 每次執行連續收集約5.5小時（每分鐘一筆），每10分鐘存檔一次；
# 執行結束、逾時或被取消時，最後一步仍會把剩下的資料存檔。
# 每次一開始就排好下一次（自我接力）；排程每小時觸發只是備援。
# 同一時間只跑一個，前一個結束後，排隊中的下一個會立刻接手。
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect-vd
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 一律取main最新版，避免停在舊commit（detached HEAD）
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "${{ github.repository }}" || echo "::warning::queue next run failed"
      - name: Collect for ~5.5 hours
        timeout-minutes: 335
        run: |
          end=$((SECONDS + 19800))
          last=$SECONDS
          while [ $SECONDS -lt $end ]; do
            python3 collect.py || echo "::warning::fetch failed $(date -u +%H:%MZ)"
            if [ $((SECONDS - last)) -ge 600 ]; then ./save.sh; last=$SECONDS; fi
            sleep $((65 - 10#$(date +%S)))
          done
      - name: Final save
        if: always()
        run: ./save.sh
